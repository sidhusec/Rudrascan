---
- hosts: all
  become: true
  vars:
    rudrascan_repo: "https://github.com/six2dez/rudrascan.git"
    rudrascan_dest: "/opt/rudrascan"
    rudrascan_branch_default: "main"
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 86400

    - name: Ensure git is installed (required to clone the repo)
      ansible.builtin.apt:
        name: git
        state: present

    - name: Clone RudraScan
      ansible.builtin.git:
        repo: "{{ rudrascan_repo }}"
        dest: "{{ rudrascan_dest }}"
        version: "{{ rudrascan_branch | default(rudrascan_branch_default) }}"
        update: yes

    - name: Install RudraScan dependencies and tools
      ansible.builtin.command: ./install.sh --verbose
      args:
        chdir: "{{ rudrascan_dest }}"

    - name: Copy rudrascan.cfg
      ansible.builtin.copy:
        src: files/rudrascan.cfg
        dest: "{{ rudrascan_dest }}/rudrascan.cfg"
        owner: root
        group: root
        mode: "0644"
